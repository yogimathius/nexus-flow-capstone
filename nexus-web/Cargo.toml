[package]
name = "client-dream-ai"
version = "0.1.0"
edition = "2021"
authors = ["Mathius Edwin Johnson <60864543+yogimathius@users.noreply.github.com>"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.8.2", features = ["csr"] }
leptos_meta = { version = "0.8.2" }
leptos_router = { version = "0.8.2" }
console_log = "1"
log = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document", 
    "Window", 
    "Request", 
    "RequestInit", 
    "RequestMode", 
    "Response", 
    "Headers",
    "FormData",
    "HtmlFormElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "SubmitEvent",
    "Storage",
    "HtmlElement"
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
html-escape = "0.2"
form_urlencoded = "1.2"
js-sys = "0.3.77"
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-net = "0.5.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4.41"
# CSS Modules

# utils
# strum = { version = "0.25", features = ["derive", "strum_macros"] }
# strum_macros = "0.25"


[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
