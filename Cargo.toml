[package]
name = "axum-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = "0.8.3"
bytes = "1.10.1"
chrono ={ version = "0.4.40", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15.0"
dotenvy = "0.15.7"
reqwest ={ version =  "0.12.15", features = ["json"] }
rmcp = { version= "0.1.5", features = ["server", "client", "transport-child-process", "transport-sse"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "chrono", "migrate"] }
tokio = { version = "1.44.2" , features = ["full"] }
tokio-postgres = "0.7"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.5.22"
